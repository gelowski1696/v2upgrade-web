name: posv2-owner

services:
  postgres:
    # Debian Bookworm's postgresql-client is version 15, so keep pg_dump and the server aligned.
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../../subsapi
      dockerfile: Dockerfile
      args:
        BUILD_RELEASE: ${API_RELEASE:-development}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SWAGGER_ENABLED: 'false'
      PORT: 3100
      TRUST_PROXY: 'true'
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      DEVICE_JWT_SECRET: ${DEVICE_JWT_SECRET}
      PORTAL_JWT_ACCESS_SECRET: ${PORTAL_JWT_ACCESS_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      ADMIN_REMEMBER_LOGIN_TTL_DAYS: ${ADMIN_REMEMBER_LOGIN_TTL_DAYS:-30}
      ADMIN_BROWSER_SESSION_TTL_HOURS: ${ADMIN_BROWSER_SESSION_TTL_HOURS:-24}
      ADMIN_REFRESH_REUSE_GRACE_SECONDS: ${ADMIN_REFRESH_REUSE_GRACE_SECONDS:-5}
      LICENSE_LEASE_DAYS: ${LICENSE_LEASE_DAYS:-7}
      DEVICE_TOKEN_TTL: ${DEVICE_TOKEN_TTL:-12h}
      PORTAL_ACCESS_TOKEN_TTL: ${PORTAL_ACCESS_TOKEN_TTL:-15m}
      PORTAL_REFRESH_TOKEN_TTL_DAYS: ${PORTAL_REFRESH_TOKEN_TTL_DAYS:-30}
      PORTAL_REFRESH_REUSE_GRACE_SECONDS: ${PORTAL_REFRESH_REUSE_GRACE_SECONDS:-5}
      PORTAL_PASSWORD_RESET_TTL_MINUTES: ${PORTAL_PASSWORD_RESET_TTL_MINUTES:-60}
      WEB_ANALYTICS_RETENTION_DAYS: ${WEB_ANALYTICS_RETENTION_DAYS:-90}
      OWNER_WEB_ANALYTICS_ENABLED: ${OWNER_WEB_ANALYTICS_ENABLED:-true}
      OWNER_REAL_USER_MONITORING_ENABLED: ${OWNER_REAL_USER_MONITORING_ENABLED:-true}
      ADMIN_WEB_ANALYTICS_VIEW_ENABLED: ${ADMIN_WEB_ANALYTICS_VIEW_ENABLED:-true}
      WEB_REMEMBER_LOGIN_ENABLED: ${WEB_REMEMBER_LOGIN_ENABLED:-true}
      STORE_SNAPSHOT_ROOT: /app/data
      STORE_SNAPSHOT_MAX_BYTES: ${STORE_SNAPSHOT_MAX_BYTES:-536870912}
      STORE_SNAPSHOT_RETAIN_PREVIOUS: ${STORE_SNAPSHOT_RETAIN_PREVIOUS:-2}
      STORE_SCHEMA_MIN_VERSION: ${STORE_SCHEMA_MIN_VERSION:-27}
      STORE_SCHEMA_MAX_VERSION: ${STORE_SCHEMA_MAX_VERSION:-27}
      STORE_CLIENT_CACHE_MAX: ${STORE_CLIENT_CACHE_MAX:-25}
      STORE_CLIENT_IDLE_MILLISECONDS: ${STORE_CLIENT_IDLE_MILLISECONDS:-600000}
      CORS_ORIGINS: https://${OWNER_DOMAIN},https://${ADMIN_DOMAIN},tauri://localhost,http://tauri.localhost,https://tauri.localhost
      PORTAL_WEB_ORIGINS: https://${OWNER_DOMAIN}
      ADMIN_WEB_ORIGINS: https://${ADMIN_DOMAIN}
      PLATFORM_BACKUP_ROOT: /app/backups
      PLATFORM_BACKUP_RETAIN_DAYS: ${PLATFORM_BACKUP_RETAIN_DAYS:-30}
      POSTGRES_BIN: /usr/bin
      PORTAL_SCHEDULED_REPORTS_ENABLED: ${PORTAL_SCHEDULED_REPORTS_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      BILLING_COMPANY_NAME: ${BILLING_COMPANY_NAME:-VMJAMTECH}
      BILLING_COMPANY_ADDRESS: ${BILLING_COMPANY_ADDRESS:-}
      BILLING_SUPPORT_EMAIL: ${BILLING_SUPPORT_EMAIL:-}
      BILLING_SUPPORT_PHONE: ${BILLING_SUPPORT_PHONE:-}
      BILLING_PAYMENT_INSTRUCTIONS: ${BILLING_PAYMENT_INSTRUCTIONS:-}
    volumes:
      - store_snapshots:/app/data
      - platform_backups:/app/backups
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3201}:3100'
    expose:
      - '3100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3100/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        BUILD_RELEASE: ${OWNER_WEB_RELEASE:-development}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3200}:80'
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/healthz']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

  subscription-web:
    image: posv2-subscriptions-web:${SUBSCRIPTION_WEB_IMAGE_TAG:-latest}
    build:
      context: ../../subscriptionapp-posv2
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${SUBSCRIPTION_WEB_HOST_PORT:-3202}:8080'
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    profiles:
      - direct-https
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      subscription-web:
        condition: service_healthy
    environment:
      OWNER_DOMAIN: ${OWNER_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: posv2_postgres_data
  store_snapshots:
    name: posv2_store_snapshots
  platform_backups:
    name: posv2_platform_backups
  caddy_data:
    name: posv2_caddy_data
  caddy_config:
    name: posv2_caddy_config

networks:
  edge:
  backend:
    internal: true
