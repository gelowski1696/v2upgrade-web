server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/security-headers.conf;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = /build-info.json {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* "-[a-z0-9]{8,}\.(?:css|js|png|jpg|jpeg|gif|svg|webp|woff|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
}
